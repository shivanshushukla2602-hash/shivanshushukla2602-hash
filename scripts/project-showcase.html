<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:Sora;src:url('../assets/fonts/sora.woff2')}@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-regular.ttf')}@font-face{font-family:Fraunces;src:url('../assets/fonts/fraunces-italic.woff2')}
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee9df;font-family:Manrope}main{height:100vh;position:relative;overflow:hidden;border:1px solid #30302e;border-radius:22px;display:grid;grid-template-columns:46% 54%;padding:30px 34px;gap:12px;background:linear-gradient(120deg,#151514,#0b0b0b)}
.copy{z-index:3;display:flex;flex-direction:column;padding-right:18px}.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#b9b5ac}.no{border:1px solid #45443f;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;letter-spacing:0;font-size:11px}.title{font-family:Sora;font-size:35px;letter-spacing:-1.9px;line-height:1.15;margin:22px 0 12px;font-weight:600}.desc{font-size:15px;line-height:1.65;margin:0;max-width:350px;color:#b9b5ac}.bottom{margin-top:auto;display:flex;gap:14px;align-items:center}.stack{font-size:10px;letter-spacing:.5px;color:#b9b5ac}.open{border-top:1px solid #5c5a53;padding-top:9px;font-size:12px;white-space:nowrap}.arrow{font-size:22px;margin-left:7px}.art{position:relative;perspective:1000px;display:flex;align-items:center;justify-content:center}.grid{position:absolute;inset:-30px;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse,black,transparent 70%)}
.window{width:100%;height:235px;position:relative;z-index:2;transform-style:preserve-3d;border:1px solid #ffffff48;border-radius:10px;overflow:hidden;box-shadow:0 18px 45px #0009;background:#171717}.chrome{height:25px;background:#20201f;display:flex;gap:4px;align-items:center;padding:0 10px;border-bottom:1px solid #ffffff20}.dot{width:4px;height:4px;background:#77766e;border-radius:100%}.url{margin:auto;font-size:8px;letter-spacing:.6px;color:#b6b2a7}.window img{width:100%;height:calc(100% - 25px);object-fit:cover;object-position:top;display:block}.underlay{position:absolute;width:92%;height:225px;border:1px solid var(--accent);border-radius:12px;opacity:.32;transform:rotate(-5deg) translateY(9px)}
.badge{position:absolute;z-index:4;right:5px;bottom:0;font-size:10px;letter-spacing:1.4px;padding:10px 14px;border:1px solid #ffffff30;border-radius:30px;background:#121211;color:var(--accent);box-shadow:0 6px 20px #0007}.spark{position:absolute;width:50px;height:50px;top:0;left:4px;z-index:4;color:var(--accent)}.orbit{position:absolute;width:14px;height:14px;border:2px solid var(--accent);top:0;right:20px;transform:rotate(45deg)}.shine{position:absolute;inset:0;border:1px solid var(--accent);border-radius:10px;opacity:.28;transform:translate(10px,10px)}
.reverse .art{grid-column:1;grid-row:1}.reverse .copy{grid-column:2;grid-row:1;padding:0 0 0 30px}.reverse{grid-template-columns:54% 46%}
@media(max-width:700px){main,main.reverse{padding:30px;grid-template-columns:1fr;grid-template-rows:245px 1fr;gap:20px}.copy,.reverse .copy{grid-column:1;grid-row:1;padding:0}.art,.reverse .art{grid-column:1;grid-row:2;margin:0 9px 8px}.title{font-size:39px;margin:18px 0 10px}.eyebrow{font-size:12px}.desc{font-size:21px;max-width:100%;line-height:1.5}.bottom{gap:20px;margin-top:19px}.stack{font-size:13px}.open{font-size:15px}.window{height:255px}.underlay{height:245px}.badge{bottom:-4px;font-size:12px}.spark{top:-6px;left:-6px}.chrome{height:28px}.window img{height:calc(100% - 28px)}.url{font-size:10px}}
</style><main><div class="copy"><div class="eyebrow"><span class="no"></span><span id="context"></span></div><h1 class="title"></h1><p class="desc"></p><div class="bottom"><span class="stack"></span><span class="open">View project <span class="arrow">↗</span></span></div></div><div class="art"><div class="grid"></div><div class="underlay"></div><div class="orbit"></div><svg class="spark" viewBox="0 0 60 60"><g stroke="currentColor" stroke-width="1.5"><path d="M30 5v50M5 30h50M12 12l36 36M12 48l36-36"/></g></svg><div class="window"><div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="url"></span></div><img><div class="shine"></div></div><span class="badge"></span></div></main><script>
window.configure=async p=>{document.querySelector('main').classList.toggle('reverse',p.i%2===1);document.body.style.setProperty('--accent',p.color);for(const [s,v]of Object.entries({'.no':String(p.i+1).padStart(2,'0'),'#context':p.context,'.title':p.title,'.desc':p.desc,'.stack':p.stack,'.badge':p.badge,'.url':p.url}))document.querySelector(s).textContent=v;const im=document.querySelector('.window img');im.src='../assets/project-previews/'+p.image;await im.decode();await document.fonts.ready;};
window.setFrame=f=>{const t=f/48*Math.PI*2,s=Math.sin(t),c=Math.cos(t);document.querySelector('.window').style.transform=`translateY(${s*5}px) rotateX(${c*3}deg) rotateY(${s*5}deg) rotateZ(${-2+s*1.2}deg)`;document.querySelector('.underlay').style.transform=`translateY(${9-s*5}px) rotate(${4+c*2}deg)`;document.querySelector('.spark').style.transform=`rotate(${f/48*90}deg)`;document.querySelector('.orbit').style.transform=`translateY(${c*9}px) rotate(${45+s*25}deg)`;document.querySelector('.badge').style.transform=`translateY(${-s*4}px)`;};
</script>
