<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title"><title id="title">Get in touch: open to internships and collaboration.</title><rect x="1" y="1" width="1198" height="228" rx="18" fill="#141413" stroke="#44433e"/><text x="36" y="43" font-family="Arial,sans-serif" font-size="10" font-weight="normal" fill="#b7b6af" letter-spacing="2">SOMETHING WORTH BUILDING?</text><text x="36" y="92" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#eee2c6" >Let’s make the next thing.</text><text x="36" y="133" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#f5f4ef" >An internship. A collaboration. A good conversation.</text><path d="M36 163H1164" stroke="#474438"/><text x="36" y="197" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#b7b6af" >SHIV&amp;SHU / BENGALURU, INDIA</text><text x="1160" y="197" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#b7b6af" text-anchor="end">ALWAYS A WORK IN PROGRESS.</text></svg>