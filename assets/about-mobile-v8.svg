<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">About Shivanshu: a curious, hands-on computer science student at PW IOI in Bengaluru. Focused on Java, JavaScript and DSA. Open to internships and collaboration.</title><defs><linearGradient id="coral" x2=".7" y2="1"><stop stop-color="#ffd8cd"/><stop offset="1" stop-color="#c97e7d"/></linearGradient><linearGradient id="sage" x2=".7" y2="1"><stop stop-color="#d4eee2"/><stop offset="1" stop-color="#73ae99"/></linearGradient><linearGradient id="gold" x2=".7" y2="1"><stop stop-color="#faedb9"/><stop offset="1" stop-color="#c8a461"/></linearGradient></defs><style>@media(prefers-reduced-motion:reduce){.motion{animation:none!important;display:none}}</style><rect x="1" y="1" width="598" height="513" rx="24" fill="#0b0b0b" stroke="#30302e"/><text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#a9a59d" letter-spacing="2.2">THE PERSON BEHIND THE PROJECTS</text><text x="32" y="108" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#eee9df" letter-spacing="-1.8">A curious mind.</text><text x="32" y="158" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#eee9df" letter-spacing="-1.8">A hands-on learner.</text><text x="34" y="226" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#a9a59d" >Studying computer science at PW IOI.</text><text x="34" y="258" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#a9a59d" >Learning by making, testing, and trying again.</text><text x="34" y="323" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#a9a59d" letter-spacing="2.2">BASED IN</text><text x="34" y="351" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="normal" fill="#eee9df" >Bengaluru, India</text><text x="34" y="387" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#a9a59d" letter-spacing="2.2">CURRENT FOCUS</text><text x="34" y="415" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="normal" fill="#eee9df" >Java, JavaScript &amp; DSA</text><text x="34" y="451" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#a9a59d" letter-spacing="2.2">OPEN TO</text><text x="34" y="479" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="normal" fill="#eee9df" >Internships &amp; collaboration</text></svg>